[project]
name = "sogno-entreprise"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.2",
    "pydantic==2.13.4",
    "torch==2.7.1",
    "sentence-transformers==5.7.0",
    "qdrant-client==1.19.0",
    "groq==1.6.0",
    "python-dotenv==1.2.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.vercel]
entrypoint = "api:app"